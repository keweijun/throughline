[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-guided-learning"
version = "0.1.0"
description = "Local, transactional course workspace for cross-document guided learning"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=6,<7"]

[project.scripts]
guided-learning = "guided_learning.__main__:main"

[tool.setuptools.packages.find]
include = ["guided_learning*"]

[tool.setuptools.package-data]
guided_learning = ["web_static/*"]
