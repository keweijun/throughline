[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "throughline"
version = "0.24.0"
description = "Throughline: guided learning across your documents, taught by Codex"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.urls]
Homepage = "https://github.com/keweijun/throughline"

[project.optional-dependencies]
pdf = ["pypdf>=6,<7", "pypdfium2>=5,<6", "Pillow>=11,<13"]
# The Python tests drive the server through Starlette's test client.
dev = ["httpx2>=2,<3"]

[project.scripts]
guided-learning = "guided_learning.__main__:main"
throughline = "guided_learning.__main__:throughline"
guided-learning-web = "guided_learning.web:main"

[tool.setuptools.packages.find]
include = ["guided_learning*"]

[tool.setuptools.package-data]
guided_learning = ["web_dist/*", "web_dist/assets/*", "skill/*.md", "skill/references/*.md", "skill/agents/*.yaml", "icons/*"]
